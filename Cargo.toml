[package]
name = "ternitor"
version = "1.0.0"
edition = "2021"
description = "Hides the blank console windows Windows opens on behalf of console-less agent processes"
authors = ["asterxsk"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"   # size, not speed: nothing here is hot enough to care
lto = true
codegen-units = 1
panic = "abort"
strip = true
