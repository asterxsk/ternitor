<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 376" width="920" role="img" aria-labelledby="t d">
  <title id="t">Ternitor, animated</title>
  <desc id="d">A blank console window opens over the Ternitor settings screen while the switch is still off, and everything dims behind it. A beat later the switch flips to ON, the console disappears, and the hidden counter steps from 000 to 003.</desc>

  <defs>
    <!-- Film grain. Turbulence rather than thousands of one-pixel rects: same
         tooth, a fraction of the bytes. Two densities, matching the baked
         scatter the app draws at 3% coverage with rare brighter specks. -->
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="344" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.071  0 0 0 0 0.071  0 0 0 0 0.071  1 0 0 0 -0.78"/>
    </filter>
    <filter id="dust" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="344" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="29" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.173  0 0 0 0 0.173  0 0 0 0 0.173  1 0 0 0 -0.96"/>
    </filter>

    <clipPath id="client"><rect width="720" height="344"/></clipPath>
    <clipPath id="wheel3"><rect x="636" y="46" width="39" height="58"/></clipPath>

    <!-- The intruder: a blank console. Its edges are brighter than anything the
         plate itself is allowed — structure here never exceeds #2E2E2E — because
         this is not part of the bench, it is the thing that is about to be taken
         off it. Title bar carrying the image path the app would read off the
         real window, and nothing beneath it: a window with nothing in it is the
         whole of what Ternitor hides, so a prompt here would be a lie. -->
    <g id="console">
      <rect x="-90" y="-60" width="180" height="120" fill="#0A0A0A" stroke="#7A7A7A"/>
      <rect x="-90" y="-60" width="180" height="12" fill="#1A1A1A"/>
      <line x1="-90" y1="-48" x2="90" y2="-48" stroke="#2E2E2E"/>
      <text x="-84" y="-51" font-family="Cascadia Mono, Consolas, monospace" font-size="7" fill="#C0C0C0">C:\WINDOWS\system32\cmd.exe</text>
      <line x1="70" y1="-54" x2="78" y2="-54" stroke="#8A8A8A"/>
      <path d="M82 -57 l6 6 M88 -57 l-6 6" stroke="#8A8A8A" fill="none"/>
    </g>
  </defs>

  <!-- Window frame. The DWM caption is tinted to the ground, so the OS chrome
       reads as part of the plate. No maximize box: the layout is fixed-size. -->
  <rect x="0.5" y="0.5" width="721" height="375" rx="8" fill="#000000" stroke="#2E2E2E"/>
  <text x="14" y="20" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#8A8A8A">Ternitor</text>
  <line x1="664" y1="19" x2="674" y2="19" stroke="#8A8A8A"/>
  <path d="M686 15 l9 9 M695 15 l-9 9" stroke="#8A8A8A" fill="none"/>

  <g transform="translate(1,31)" clip-path="url(#client)">
    <!-- ground, then grain through it -->
    <rect width="720" height="344" fill="#000000"/>
    <rect width="720" height="344" filter="url(#grain)"/>
    <rect width="720" height="344" filter="url(#dust)"/>

    <!-- head -->
    <text x="44" y="37" font-family="Franklin Gothic Medium, Segoe UI, sans-serif" font-size="21" fill="#FFFFFF">Ternitor</text>
    <text font-family="Franklin Gothic Book, Segoe UI, sans-serif" font-size="13.5" fill="#C0C0C0">
      <tspan x="44" y="69">Hides the blank console windows Windows opens for processes that</tspan>
      <tspan x="44" y="89">have no console of their own &#8212; hidden the instant they appear,</tspan>
      <tspan x="44" y="109">so nothing ever flashes on screen.</tspan>
    </text>
    <path d="M44 128H676" stroke="#262626"/>

    <!-- counter housing and its two static wheels; the third is animated below -->
    <text x="676" y="33" text-anchor="end" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8A8A8A">HIDDEN THIS SESSION</text>
    <rect x="550" y="46" width="126" height="58" fill="none" stroke="#2E2E2E"/>
    <path d="M591.5 46V104M634.5 46V104" stroke="#2E2E2E"/>
    <text x="570" y="75" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Mono, Consolas, monospace" font-size="34" font-weight="600" fill="#FFFFFF">0</text>
    <text x="613" y="75" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Mono, Consolas, monospace" font-size="34" font-weight="600" fill="#FFFFFF">0</text>

    <!-- fields, left column -->
    <text x="44" y="153" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8A8A8A">LAST CUT</text>
    <text x="44" y="174" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#8A8A8A">nothing cut yet</text>
    <text x="44" y="213" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8A8A8A">STARTED</text>
    <text x="44" y="230" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#FFFFFF">14:07:22</text>
    <text x="180" y="213" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8A8A8A">ELAPSED</text>
    <text x="180" y="230" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#FFFFFF">1h 42m</text>

    <!-- fields, right column: the switch and its small print -->
    <text x="452" y="153" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8A8A8A">START WITH WINDOWS</text>
    <text x="452" y="226" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="12" fill="#C0C0C0">Runs Ternitor when you sign in. Adds one</text>
    <text x="452" y="243" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="12" fill="#C0C0C0">value to the registry, under HKCU.</text>

    <!-- footer: app info, where the log is, and the way out -->
    <path d="M44 284H676" stroke="#262626"/>
    <text x="44" y="312" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#8A8A8A">v1.0.0  &#183;  windows-x86_64</text>
    <text x="564" y="312" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#8A8A8A">log: ternitor.log</text>
    <rect x="588" y="288" width="88" height="28" rx="4" fill="none" stroke="#C0C0C0"/>
    <text x="632" y="305" text-anchor="middle" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#C0C0C0">QUIT</text>

    <!-- ================= everything live, on one 13s loop =================
         Two beats, deliberately far apart. First the problem: a blank console
         opens and sits there, alone, with the bench dimmed behind it — nothing
         else on the surface moves for a second and a half, so there is no
         chance of reading this as one gesture with what follows. Then the fix:
         the switch snaps on, and a second later the console is gone and the
         counter has moved.

         The hides after the first are never shown at all, because by then
         Ternitor is running — which is the whole product, and the counter is the
         whole of what it shows you.

         Every number below is seconds into the loop; keyTimes is that over 13.
         The last stretch of each cycle fades the whole live layer out and back
         in, and that gap is where every value resets. -->
    <g id="live">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.73846;0.76923;0.79231;0.82308;1" dur="13s" repeatCount="indefinite"/>

      <!-- LAST CUT: the field empties out and takes the console's title -->
      <g font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#FFFFFF">
        <text x="44" y="174" fill="#8A8A8A">nothing cut yet
          <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.27692;0.28462;0.73846;0.76923;1" dur="13s" repeatCount="indefinite"/>
        </text>
        <text x="44" y="174" opacity="0">C:\WINDOWS\system32\cmd.exe
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27692;0.28462;0.73846;0.76923;1" dur="13s" repeatCount="indefinite"/>
        </text>
      </g>

      <!-- the counter's third wheel, rolling as each hide lands: 3.6s, 5.6s, 7.6s -->
      <g clip-path="url(#wheel3)">
        <g>
          <animateTransform attributeName="transform" type="translate" dur="13s" repeatCount="indefinite"
            values="0 0;0 0;0 -58;0 -58;0 -116;0 -116;0 -174;0 -174;0 0;0 0"
            keyTimes="0;0.27692;0.3;0.43077;0.45385;0.58462;0.60769;0.73846;0.76923;1"/>
          <g font-family="Cascadia Mono, Consolas, monospace" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">
            <text x="656" y="75">0</text>
            <text x="656" y="133">1</text>
            <text x="656" y="191">2</text>
            <text x="656" y="249">3</text>
          </g>
        </g>
      </g>

      <!-- the switch: a track and a knob, the knob concentric with the end it
           sits in, so OFF is an outlined knob in an outlined track and ON is a
           knocked-out knob in an inked one. The flip is a snap. -->
      <g>
        <text x="452" y="153" font-family="Arial Narrow, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8A8A8A">START WITH WINDOWS</text>
        <g>
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.2;0.82308" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
          <rect x="452" y="164" width="64" height="36" rx="18" fill="#000000" stroke="#C0C0C0"/>
          <circle cx="470" cy="182" r="12" fill="none" stroke="#C0C0C0"/>
          <text x="541" y="182" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#C0C0C0">OFF</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.82308" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
          <rect x="452" y="164" width="64" height="36" rx="18" fill="#FFFFFF" stroke="#FFFFFF"/>
          <circle cx="498" cy="182" r="12" fill="#000000"/>
          <line x1="530" y1="191" x2="535" y2="180" stroke="#FF6A13" stroke-width="3"/>
          <text x="541" y="182" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#FFFFFF">ON</text>
        </g>
      </g>

      <!-- The scrim, then the intruder. The bench dims while a console is up,
           because a window that steals focus is exactly what this is a picture
           of. Scrim first, console second. -->
      <g>
        <rect width="720" height="344" fill="#000000" opacity="0">
          <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.05385;0.07692;0.25769;0.27692;1" dur="13s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g opacity="0" transform="translate(350 190)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04615;0.07692;0.25769;0.27692;1" dur="13s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" dur="13s" repeatCount="indefinite"
            values="0.86;0.86;1;1;0.9;0.9;0.86;0.86" keyTimes="0;0.04615;0.07692;0.25769;0.27692;0.73846;0.76923;1"/>
          <use href="#console"/>
        </g>
      </g>
    </g>
  </g>
</svg>
